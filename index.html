<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06101d"><title>K9 RAFAC Camp Companion</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="K9 — your RAFAC camp companion for Leeming 2026. Programme, uniform, flight and flying.">
<link rel="icon" href="images/k9.jpg"><link rel="apple-touch-icon" href="images/k9.jpg">
<link rel="manifest" href="manifest.webmanifest">
<script>
// Load the stylesheet with a cache-buster, so a phone that opened the app
// yesterday does not keep yesterday's styling. document.write is used
// deliberately: it blocks parsing until the sheet is in, which avoids the
// page flashing up unstyled the way an injected <link> would.
document.write('<link rel="stylesheet" href="style.css?v=' + Date.now() + '">');
</script>
<noscript><link rel="stylesheet" href="style.css"></noscript></head>
<body><main class="app">
<header><img src="images/k9.jpg" alt=""><div><h1>K9</h1><p>RAFAC CAMP COMPANION • LEEMING 2026</p></div></header>

<section class="card hero"><h2 id="personTitle"><span id="personRole">CADET</span> <span data-id></span></h2>
<p class="bunk"><span class="pill" data-flight></span> <span class="pill info" data-tent hidden></span></p>
<p class="muted small" data-roster-error hidden></p>
<div id="staffTesting" hidden>
<label class="small" for="cadetInput">Staff: view cadet</label>
<input id="cadetInput" inputmode="numeric" maxlength="3" placeholder="001" autocomplete="off">
<button type="button" onclick="setId(document.getElementById('cadetInput').value)">VIEW CADET</button>
</div>
<div class="nav">
<button type="button" onclick="show('home',this)" class="active" aria-label="Home"><span aria-hidden="true">🏠</span><br>Home</button>
<button type="button" onclick="show('week',this)" aria-label="My Week"><span aria-hidden="true">📅</span><br>My Week</button>
<button type="button" onclick="show('flying',this)" aria-label="Flying"><span aria-hidden="true">✈️</span><br>Flying</button>
<button type="button" onclick="show('uniform',this)" aria-label="Uniform"><span aria-hidden="true">👕</span><br>Uniform</button>
<button type="button" onclick="show('more',this)" aria-label="More"><span aria-hidden="true">☰</span><br>More</button>
</div>
</section>

<section id="home" class="view active">
<div class="card next" id="next"></div>
<div id="alerts"></div>
</section>

<section id="week" class="view"></section>

<section id="flying" class="view">
</section>

<section id="uniform" class="view">
<div class="card"><div class="section-title"><h2>👕 Uniform Guide</h2><span class="pill blues">APPROVED</span></div>
<p class="muted">Approved K9 uniform guides. Check My Week for the uniform of the day.</p>
<div class="card"><h2>🟩 Greens</h2><img class="uniform-img" src="images/uniform-greens.jpg" alt="Greens uniform layout guide" width="1024" height="1536" loading="lazy" decoding="async"></div>
<div class="card"><h2>🟦 Blues</h2><img class="uniform-img" src="images/uniform-blues.jpg" alt="Blues uniform layout guide" width="1024" height="1536" loading="lazy" decoding="async"></div>
<div class="card"><h2>🟨 Civvies</h2><img class="uniform-img" src="images/uniform-civvies.jpg" alt="Civvies guide" width="1024" height="1536" loading="lazy" decoding="async"></div>
<div class="card"><h2>🟧 Sports</h2><img class="uniform-img" src="images/uniform-sports.jpg" alt="Sports kit guide" width="1024" height="1536" loading="lazy" decoding="async"></div>
</div>
</section>

<section id="more" class="view">
<div id="staffDay" hidden></div>
<div id="mobilesStaff" hidden></div>
<div id="mobiles"></div>
</section>

<nav class="bottom">
<button onclick="show('home',this)" class="active">🏠<br>Home</button><button onclick="show('week',this)">📅<br>My Week</button><button onclick="show('flying',this)">✈️<br>Flying</button><button onclick="show('uniform',this)">👕<br>Uniform</button><button onclick="show('more',this)">☰<br>More</button>
</nav>
</main>
<script>
const params = new URLSearchParams(window.location.search);

if (params.get("staff") === "true") {
  document.getElementById("staffTesting").hidden = false;
  document.getElementById("personRole").textContent = "STAFF";
}
</script>
<script>
// Load the programme and code with a cache-buster on the end. Without this a
// phone that opened the app yesterday keeps showing yesterday's programme,
// because the browser reuses its cached copy of data.js. async = false keeps
// data.js running before script.js.
(function () {
  var v = "?v=" + Date.now();

  ["data.js", "script.js"].forEach(function (src) {
    var s = document.createElement("script");
    s.src = src + v;
    s.async = false;
    document.head.appendChild(s);
  });
})();

// Offline support, so the app still opens where there is no signal.
// Registered on load so it never delays first paint, and failure is survivable:
// without it the app simply needs a connection, as it did before.
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  });
}
</script>
</body></html>
